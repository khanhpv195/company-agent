# Production-like stack: runs the prebuilt `runtime` image, no source mounts.
#   docker compose -f docker-compose.prod.yml build      # or pull BE_IMAGE from a registry
#   DB_PASSWORD=... JWT_ACCESS_SECRET=... docker compose -f docker-compose.prod.yml up -d
# Required: DB_PASSWORD and JWT_ACCESS_SECRET (>= 32 chars, e.g. `openssl rand -base64 48`).
# Also required: APP_URL (public link base for mails) and, because production only sends real
# mail, SMTP_HOST and MAIL_FROM (MAIL_TRANSPORT defaults to smtp; SMTP_PORT/SECURE/USER/PASS optional).
# Billing: BILLING_PROVIDER=none|stripe (default none); stripe also needs STRIPE_SECRET_KEY,
# STRIPE_WEBHOOK_SECRET, STRIPE_PRICE_PRO and STRIPE_PRICE_TEAM.
# Behind a reverse proxy/load balancer set TRUST_PROXY=<number of proxies> (usually 1).
# Optional: JWT_ACCESS_TTL, JWT_REFRESH_TTL, LOG_LEVEL, throttle limits, AUDIT_RETENTION_DAYS (defaults below).
# Production refuses to start with the repo's public JWT secrets, AGENT_SIMULATOR=true, an empty
# DB_PASSWORD or CONNECTIONS_MODE=simulated. Full reference: docs/deployment.md.
name: monorepo-prod

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      POSTGRES_DB: ${DB_NAME:-app}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  be:
    image: ${BE_IMAGE:-monorepo/be:latest}
    build:
      context: .
      dockerfile: apps/be/Dockerfile
      target: runtime
    restart: unless-stopped
    stop_grace_period: 30s
    environment:
      NODE_ENV: production
      PORT: 3000
      CORS_ORIGINS: ${CORS_ORIGINS:-tauri://localhost,http://tauri.localhost}
      SWAGGER_ENABLED: ${SWAGGER_ENABLED:-false}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      FALLBACK_LANGUAGE: ${FALLBACK_LANGUAGE:-en}
      DB_HOST: postgres
      DB_PORT: 5432
      DB_USERNAME: ${DB_USERNAME:-postgres}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD is required}
      DB_NAME: ${DB_NAME:-app}
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?JWT_ACCESS_SECRET is required}
      JWT_ACCESS_TTL: ${JWT_ACCESS_TTL:-15m}
      JWT_REFRESH_TTL: ${JWT_REFRESH_TTL:-30d}
      AGENT_SIMULATOR: 'false'
      CONNECTIONS_MODE: disabled
      AUTH_THROTTLE_LIMIT: ${AUTH_THROTTLE_LIMIT:-10}
      API_THROTTLE_LIMIT: ${API_THROTTLE_LIMIT:-600}
      GATEWAY_THROTTLE_LIMIT: ${GATEWAY_THROTTLE_LIMIT:-1200}
      AUDIT_RETENTION_DAYS: ${AUDIT_RETENTION_DAYS:-365}
      # Number of reverse proxies in front of the API (e.g. 1): set it behind a proxy or all clients share one rate limit.
      TRUST_PROXY: ${TRUST_PROXY:-false}
      APP_URL: ${APP_URL:?APP_URL is required}
      MAIL_TRANSPORT: ${MAIL_TRANSPORT:-smtp}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST is required in production (mail is sent over SMTP)}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_SECURE: ${SMTP_SECURE:-false}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      MAIL_FROM: ${MAIL_FROM:?MAIL_FROM is required in production (sender address of mails)}
      BILLING_PROVIDER: ${BILLING_PROVIDER:-none}
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-}
      STRIPE_WEBHOOK_SECRET: ${STRIPE_WEBHOOK_SECRET:-}
      STRIPE_PRICE_PRO: ${STRIPE_PRICE_PRO:-}
      STRIPE_PRICE_TEAM: ${STRIPE_PRICE_TEAM:-}
      DB_SYNCHRONIZE: 'false'
      RUN_MIGRATIONS: 'true'
    ports:
      - '${BE_PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - be_storage:/app/storage

volumes:
  postgres_data:
  be_storage:
